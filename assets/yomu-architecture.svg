  <rect x="12" y="12" width="181" height="103" rx="4" fill="#8D706A"/>
  <path d="M15 103 68 53 110 92 145 36 191 88" stroke="#D4BCAF" stroke-width="2"/>
  <rect x="12" y="125" width="84" height="113" rx="4" fill="#AF9288"/><rect x="106" y="125" width="87" height="113" rx="4" fill="#6A5257"/>
  <ellipse cx="139" cy="45" rx="38" ry="20" fill="#FFF6E6"/>
