<path d="M859 150H895m-10-10 10 10-10 10" stroke="#FF9B88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="671" y="296" width="473" height="37" rx="18.5" fill="#100E14" stroke="#75504C"/>
